<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQMap | Rescue Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
</head>
<body class="command-body">
    <header>
        <div class="logo">🚨 ResQMap Command <span class="badge-dev">Lead Dev: Jyansh Jain</span></div>
        <a href="index.html?developer=jyansh-jain" class="back-link">⬅ Exit to Portal Selection</a>
    </header>

    <div class="command-dashboard-layout">
        <!-- Main Tactical Map View -->
        <div class="map-section">
            <div class="dash-header">
                <h2>Live Tactical Satellite Command Center</h2>
                
                <!-- LIVE ANALYTICS COUNTERS -->
                <div class="analytics-bar">
                    <span class="stat-badge stat-total">Total: <b id="cntTotal">0</b></span>
                    <span class="stat-badge stat-critical">Critical: <b id="cntCritical">0</b></span>
                    <span class="stat-badge stat-moderate">Moderate: <b id="cntModerate">0</b></span>
                </div>

                <div class="status-legend">
                    <span><span class="dot red"></span> Critical SOS</span>
                    <span><span class="dot yellow"></span> Moderate</span>
                    <span><span class="dot green"></span> Safe Zone</span>
                    <span><span class="dot orange"></span> Landslide Risk</span>
                </div>
            </div>
            <div id="map" class="full-tactical-map"></div>
        </div>

        <!-- Real-Time AI Alerts Sidebar -->
        <div class="alerts-sidebar">
            <h3>🚨 Active Dispatch Requests</h3>
            <p class="sidebar-subtitle">Real-Time AI Categorized Victims Queue</p>
            <div id="requestCards" class="sidebar-cards-container">
                <!-- Live SOS Cards will appear here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
